<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🌍 Travel Planner</h1>
        <p>Plan your destinations, dates and activities</p>
    </header>
    <main>
        <section class="form-section">
            <h2 id="formTitle">Add Destination</h2>
            <form id="travelForm">
                <div class="form-group">
                    <label for="destination">Destination</label>
                    <input
                        type="text"
                        id="destination"
                        placeholder="Enter destination"
                        required
                    >
                </div>
                <div class="form-group">
                    <label for="date">Date</label>
                    <input
                        type="date"
                        id="date"
                        required
                    >
                </div>
                <div class="form-group">
                    <label for="activity">Activity</label>
                    <input
                        type="text"
                        id="activity"
                        placeholder="Enter activity"
                        required
                    >
                </div>
                <div class="form-group">
                    <label for="location">Location</label>
                    <input
                        type="text"
                        id="location"
                        placeholder="Enter location"
                        required
                    >
                </div>
                <div class="button-group">
                    <button type="submit" id="submitBtn">
                        Add Trip
                    </button>
                    <button
                        type="button"
                        id="cancelBtn"
                        class="cancel-btn"
                    >
                        Cancel
                    </button>
                </div>
            </form>
        </section>
        <section class="trips-section">
            <div class="section-header">
                <h2>My Trips</h2>
                <div class="controls">
                    <input
                        type="search"
                        id="searchInput"
                        placeholder="🔍 Search trips..."
                    >
                    <select id="sortSelect">
                        <option value="newest">
                            Sort by Date: Newest
                        </option>
                        <option value="oldest">
                            Sort by Date: Oldest
                        </option>
                    </select>
                </div>
            </div>
            <p id="emptyMessage" class="empty-message">
                No trips added yet. Add your first destination!
            </p>
            <div id="tripList" class="trip-grid"></div>
        </section>
    </main>   
</body>
</html>
